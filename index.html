কোড জানা লাগবে না। এডিট করতে হবে ফাইলের একদম নিচের অংশে (<script> ব্লকগুলোতে)।
ফাইলটা Notepad / VS Code / যেকোনো টেক্সট এডিটরে খুলুন। Ctrl+F চেপে নিচের চিহ্নগুলো খুঁজুন:

  [১] সেটিংস         → খুঁজুন:  ১. সাইটের সেটিংস
                        নাম, হিরো লেখা, About, সার্ভিস, স্ট্যাটস, কন্টাক্ট, লিংক সব এখানে।
  [২] ক্যাটাগরি       → খুঁজুন:  ২. ক্যাটাগরি
                        ক্যাটাগরির নাম, আইকন ও রং। নতুন ক্যাটাগরি যোগ বা বাদ দেওয়া এখানে।
  [৩] লেখা (আর্টিকেল) → খুঁজুন:  ৩. লেখাসমূহ
                        প্রতিটি লেখা সাধারণ টেক্সটে লেখা। নতুন লেখা যোগ করতে একটা ব্লক কপি করে বদলান।
  [৪] ক্লায়েন্ট লোগো  → খুঁজুন:  ৪. ক্লায়েন্ট লোগো
                        ক্লায়েন্টদের লোগো এখানে। নতুন লোগো যোগ বা বাদ দেওয়া এখানে।
  [৫] ছবি ও লোগো     → খুঁজুন:  ৫. আপনার ছবি
  [৬] ইঞ্জিন          → "৬. ইঞ্জিন" — এই অংশে হাত দেবেন না।

⚠ নিয়ম: লেখাগুলো ' ' বা ` ` চিহ্নের ভেতরে থাকে। ওই চিহ্ন মুছবেন না। কমা (,) মুছবেন না।
⚠ এডিটের আগে ফাইলের একটা কপি রেখে দিন। কিছু ভেঙে গেলে কপিটা আবার ব্যবহার করুন।

/* ===== রং ও মূল স্টাইল — রং বদলাতে চাইলে শুধু নিচের :root-এর কোড বদলান ===== */
:root{--bg:#ffffff;      /* পুরো সাইটের পেছনের রং (সাদা) */
--ink:#0a120c;          /* কালো (লেখা ও গাঢ় সেকশন) */

*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden}
.bn{font-family:'Hind Siliguri','Plus Jakarta Sans',sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

.mono{font:500 11px 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}

/* ছবি: ছোট, স্বচ্ছ কাটআউট, বাম পাশে — সাইজ বদলাতে নিচের width বদলান */

.spark{position:absolute;color:#2f7d4a;font-size:14px;line-height:1;animation:tw 3.5s ease-in-out infinite;z-index:2}.spark.s1{top:2%;left:30%}.spark.s2{top:52%;left:-12%;animation-delay:1s}.spark.s3{top:40%;right:-14%;animation-delay:2s}

/* ছবির ডান পাশের লেখা: চকচকে গ্লস + উজ্জ্বল ঝলক (shine) অ্যানিমেশন */

 background-size:260% 100%,100% 100%;background-repeat:no-repeat;background-position:-160% 0,0 0;animation:shine 3.6s ease-in-out infinite;filter:drop-shadow(0 1px 1.5px rgba(40,160,90,.38))}
.statement span+span{margin-top:.7em;animation-delay:.5s;background-image:linear-gradient(105deg,rgba(255,255,255,0) 38%,rgba(255,255,255,1) 50%,rgba(255,255,255,0) 62%),linear-gradient(180deg,#3fae6c 0%,#14522d 46%,#07190e 52%,#2a9156 100%)}

@keyframes shine{0%{background-position:-160% 0,0 0}55%,100%{background-position:260% 0,0 0}}

অ্যালকোহলমুক্ত ও মৃদু (Gentle, Alcohol-free) ফেসওয়াশ বা ক্লিনজার দিয়ে দিনে সর্বোচ্চ দুইবার মুখ পরিষ্কার করুন। তৈলাক্ত তোকে স্যালিসাইলিক এসিড যুক্ত ক্লিনজার সপ্তাহে কয়েকবার ব্যবহার করুন।

ত্বক অতিরিক্ত ঘষামাজা বা বারবার ধুবেন না। অতিরিক্ত মুখ ধোয়া বা হেভি ক্লিনজার ব্যবহার করলে ত্বকের প্রাকৃতিক লিপিড লেয়ার নষ্ট হয়ে যায়। ফলে তৈলাক্ত ত্বক আরও বেশি তেল তৈরি করতে শুরু করে।

## ৩. সানস্ক্রিন (Sun Protection)

স্কিনকেয়ারের সবচেয়ে গুরুত্বপূর্ণ ধাপ, যা না মানলে বাকি সব যত্নই ব্যর্থ। দিনে বাইরে যান বা ঘরের ভেতরে থাকুন, প্রতিদিন ন্যূনতম SPF 30 প্লাস ব্রড-স্পেকট্রাম সানস্ক্রিন ব্যবহার করুন।

সূর্যের অতিবেগুনি রশ্মি (UVA ও UVB) ত্বকে অকাল বার্ধক্য (Wrinkles), রোদ-পোড়া দাগ (Hyperpigmentation), ট্যান হয়ে যাওয়া এবং স্কিন ক্যান্সারের প্রধান কারণ। সানস্ক্রিন ত্বকের কোলাজেন প্রোটিন ধ্বংস হওয়া থেকে রক্ষা করে।

## Intimate wash: প্রতিদিন ব্যবহারের প্রয়োজন নেই

অনেকেই মনে করেন intimate wash ব্যবহার না করলে ব্যক্তিগত পরিচ্ছন্নতা সম্পূর্ণ হয় না। বাস্তবে যোনির ভেতরের অংশ নিজে থেকেই পরিষ্কার থাকে এবং সেখানে স্বাভাবিক জীবাণুসমষ্টি একটি সুরক্ষামূলক পরিবেশ বজায় রাখতে সাহায্য করে। সুগন্ধিযুক্ত wash, vaginal deodorant বা douche ব্যবহার করলে এই স্বাভাবিক ভারসাম্যে ব্যাঘাত ঘটতে পারে।

চুলকানি, দুর্গন্ধ, অস্বাভাবিক স্রাব বা ব্যথা হলে wash দিয়ে সমস্যা ঢাকার চেষ্টা না করে গাইনোকোলজিস্টের পরামর্শ নেওয়া উচিত।

## Harsh facial scrub: ঘষলেই ত্বক উজ্জ্বল হয় না

এপ্রিকট, আখরোট, চিনি বা শক্ত দানাযুক্ত facial scrub ত্বকে অতিরিক্ত ঘর্ষণ তৈরি করতে পারে। বিশেষ করে sensitive, dry বা acne-prone ত্বকে এসব scrub লালচে ভাব, জ্বালা, শুষ্কতা এবং ব্রণ বাড়াতে পারে।

তবে সব ধরনের physical exfoliation সম্পূর্ণ নিষিদ্ধ নয়। মূল সমস্যা হয় যখন scrub-এর দানা শক্ত হয়, মুখে বেশি চাপ প্রয়োগ করা হয় অথবা ঘন ঘন ব্যবহার করা হয়। American Academy of Dermatology-এর মতে, exfoliation ভুলভাবে করলে ত্বকে irritation এবং acne breakout বাড়তে পারে।

যাদের exfoliation প্রয়োজন, তারা ত্বকের ধরন অনুযায়ী dermatologist-এর পরামর্শে salicylic acid, lactic acid বা অন্য কোনো mild exfoliant ব্যবহার করতে পারেন। একই সময়ে scrub, exfoliating acid, retinol এবং acne treatment একসঙ্গে ব্যবহার করা উচিত নয়।

## দামী facial oil: সবার ত্বকের জন্য নয়

Facial oil সম্পূর্ণ অকার্যকর—এমন বলা ঠিক নয়। কিছু oil শুষ্ক ত্বকের moisture loss কমাতে সাহায্য করতে পারে। তবে এটি moisturizer-এর বিকল্প নয় এবং acne-prone ত্বকে কিছু oil blackhead, whitehead বা ব্রণ বাড়াতে পারে।

কোন oil আপনার জন্য উপযোগী হবে, তা নির্ভর করে oil-এর ধরন, formulation এবং আপনার ত্বকের বৈশিষ্ট্যের ওপর। কিছু facial oil pore clogging করতে পারে বলে Cleveland Clinic সতর্ক করেছে।

তৈলাক্ত বা ব্রণপ্রবণ ত্বকের জন্য সাধারণত fragrance-free, non-comedogenic moisturizer বেশি ব্যবহারিক। আর দামী product মানেই বেশি কার্যকর—এই ধারণাটিও সঠিক নয়।

## Rose water: প্রয়োজনীয় নয়, আবার সবার জন্য ক্ষতিকরও নয়

Rose water-কে অনেকেই toner, pore tightener বা glow booster হিসেবে ব্যবহার করেন। কিন্তু এটি ত্বককে স্থায়ীভাবে ফর্সা করবে, pore ছোট করবে বা hydration-এর জন্য অপরিহার্য—এমন শক্ত বৈজ্ঞানিক প্রমাণ নেই।

অন্যদিকে rose water-কে একেবারে নিষিদ্ধ বলাও ঠিক নয়। সমস্যাটি মূলত formulation-এ। কোনো product-এ fragrance, essential oil বা irritating preservative থাকলে sensitive ত্বকে জ্বালা বা allergic contact dermatitis হতে পারে। Fragrance এবং preservative cosmetics-related reaction-এর সাধারণ কারণগুলোর মধ্যে পড়ে।

তাই rose water ব্যবহার করতে চাইলে fragrance-free product বেছে নিন এবং প্রথমে ছোট জায়গায় patch test করুন। ব্যবহারের পর চুলকানি, জ্বালা বা লালচে ভাব দেখা দিলে productটি বন্ধ করুন।

## E-cap বা Vitamin E capsule মুখে মাখা

Vitamin E capsule সাধারণত খাওয়ার জন্য তৈরি করা হয়। ক্যাপসুল কেটে সরাসরি মুখে লাগালে সবার উপকার হবে—এমন প্রমাণ নেই। এর তেল ঘন ও আঠালো হওয়ায় কিছু মানুষের ক্ষেত্রে pore clogging বা ব্রণ বাড়তে পারে।

Topical vitamin E ব্যবহারে কিছু মানুষের allergic contact dermatitis-ও হতে পারে, আর বিভিন্ন skin condition-এ এর কার্যকারিতা নিয়ে controlled clinical evidence সীমিত।

তাই acne-prone মুখে E-cap সরাসরি ব্যবহার না করাই ভালো। চুল বা scalp-এ ব্যবহার করলেও এটি খুশকি নিরাময়ের প্রমাণিত চিকিৎসা নয়; বরং scalp অতিরিক্ত তৈলাক্ত করতে পারে। Vitamin E ব্যবহার করতে হলে ত্বকের জন্য তৈরি, সঠিক formulation-যুক্ত product বেছে নিন।

## Sunscreen spray: অকেজো নয়, কিন্তু প্রয়োগের ভুলে সুরক্ষা কমতে পারে

Sunscreen spray সম্পূর্ণ অকেজো—এমন দাবি সঠিক নয়। তবে spray ব্যবহার করে ত্বকে পর্যাপ্ত এবং সমান layer তৈরি করা তুলনামূলক কঠিন। অনেক সময় product বাতাসে ছড়িয়ে যায় অথবা ত্বকের কিছু অংশ বাদ পড়ে যায়। ফলে বোতলে লেখা SPF-এর মতো সুরক্ষা নাও পাওয়া যেতে পারে।

American Academy of Dermatology-এর পরামর্শ অনুযায়ী spray sunscreen ব্যবহার করলে ত্বক চকচকে ভেজা দেখানো পর্যন্ত যথেষ্ট পরিমাণে spray করতে হবে এবং এরপর হাত দিয়ে ভালোভাবে ছড়িয়ে দিতে হবে। মুখে সরাসরি spray করা উচিত নয়; হাতে নিয়ে মুখে লাগাতে হবে। বাতাসের মধ্যে spray করলে তা শ্বাসের সঙ্গে শরীরে ঢোকার ঝুঁকি থাকে।

স্কিন কেয়ারে ধৈর্যের গুরুত্ব আমরা সবাই কমবেশি জানি। কিন্তু জীবনে এমন কিছু মুহূর্ত আসে যখন হাতে সময় খুব কম থাকে।

ধরুন, কয়েক সপ্তাহ পরেই বিয়ে। গায়ে হলুদের ভিডিওতে, বিয়ের অ্যালবামে নিজেকে উজ্জ্বল আর ফ্রেশ দেখাতে হবে এটা তো সবাই চাইতেই পারে এতে।

এই মুহূর্তে এখন এতো ধৈর্য নাই। ডিপ্রেশনের একদম কাছাকাছি পৌঁছে গেছেন, একের পর এক প্রোডাক্ট ট্রাই করেও কোনো ফল পাচ্ছেন না, সঠিকভাবে গাইড করার মতো কেউ নেই। এমন অবস্থায় "ধৈর্য ধরুন" কথাটা শুনতে ভালো লাগার কথা না, স্বাভাবিক।

আরেকদলের অবস্থা আরও করুণ। ইচ্ছাও আছে, ধৈর্যও আছে, কিন্তু ফলাফল তাৎক্ষণিক না পেলে চারপাশের মানুষ, বিশেষত পরিবারের সদস্যরাই নানা কথা শুনিয়ে দেন। এই চাপ সামলানো সহজ না।

তাই যখন কেউ রাত বারোটায় মেসেজ করে লেখেন, "আপু, আমাকে যত দ্রুত সম্ভব ফরসা হতে হবে" — আমরা কখনো বিরক্ত হই না, তাকে অসচেতনও মনে করি না। বরং বুঝি, কতটা কষ্ট থেকে এই মেসেজটা এসেছে। তাই যতটা সম্ভব পাশে থাকার চেষ্টা করি।

**একটা কথা পরিষ্কার করে বলে রাখি — কোনো প্রোডাক্ট আপনাকে "ফরসা" বানিয়ে দেবে, এমন দাবি আমরা কখনো করি না। ব্রাইটেনিং প্রোডাক্ট আমাদের কাছে অনেক আছে, কিন্তু আজকের পোস্টে সেটা নিয়ে বলছি না। প্রোডাক্টের পাশাপাশি নিচের অভ্যাসগুলো মেনে চলাও সমান জরুরি —**

## 🪡 সানস্ক্রিনকে প্রায়োরিটি দিন

অল্প সময়ে উজ্জ্বল হতে চাইলে সবচেয়ে বড় শত্রু নতুন ট্যান। একবার ট্যান পড়ে গেলে সেটা দূর করতেই লাগে ১-২ মাস। অথচ অনেকে মাত্র ১ সপ্তাহ হাতে রেখে যোগাযোগ করেন! ধরে নিলাম হাতে এক মাস সময় আছে — তাতেও নতুন ট্যান এত সহজে যাবে না।

তাই "তেলতেলে লাগছে", "গরম লাগছে" — এসব অজুহাত বাদ দিন। সানস্ক্রিন ত্বককে প্রোটেকশন দেয়, ট্যান পড়া আটকায়। বাইরে বের হলে সাথে সানস্ক্রিন রাখুন যাতে দরকারমতো রিঅ্যাপ্লাই করা যায়, আর ঘরে থাকলেও এটা মিস করবেন না।

## 🪡 একসাথে অনেক সিরাম নয়

"অনেকগুলো সিরাম একসাথে লাগালে তাড়াতাড়ি উজ্জ্বল হওয়া যাবে" — এই ধারণাটা সম্পূর্ণ ভুল, উল্টো ফলও হতে পারে।

১-২টা ভালো মানের সিরাম বেছে নিন। সকালের রুটিনে হালকা সিরাম, রাতের রুটিনে একটু শক্তিশালী সিরাম রাখুন। নতুন প্রোডাক্ট যোগ করলেও সপ্তাহে একটার বেশি না — বিশেষ করে সিরামের ক্ষেত্রে এই নিয়ম মানা জরুরি। একসাথে অনেক অ্যাক্টিভ ইনগ্রেডিয়েন্ট দিলে ইরিটেশনের ঝুঁকি বাড়ে, আর ইরিটেটেড ত্বকে তখন ফেসওয়াশ-ময়েশ্চারাইজার ছাড়া কিছুই লাগানো যায় না। ফলে যে দ্রুত উজ্জ্বলতার জন্য এত তাড়াহুড়ো, সেটাই আরও পিছিয়ে যায়।

## 🪡 রুটিনে সুদিং অ্যাম্পুল যোগ করুন

অ্যাম্পুল বিভিন্ন ধরনের হয় — ব্রাইটেনিং, সুদিং, ব্যারিয়ার-রিপেয়ারিং। ব্যারিয়ার সুস্থ রাখতে ভালো ময়েশ্চারাইজার তো ব্যবহার করছেনই, তাই না? না করলে আজই শুরু করুন।

আর অ্যাম্পুলের ক্ষেত্রে বেছে নিন সুদিং টাইপ। কারণ, অল্প সময়ে উজ্জ্বলতা পেতে হলে আগে ত্বকে এমন একটা পরিবেশ তৈরি করতে হয় যেখানে বাকি সব প্রোডাক্ট ঠিকভাবে কাজ করে। একনে, ব্রেকআউট, জ্বালাপোড়া বা নিষ্প্রাণ ভাব দেখা দিলে বুঝতে হবে ত্বক অস্থির অবস্থায় আছে — আর এই অবস্থায় দামি প্রোডাক্টও ঠিকঠাক কাজ করে না।

ভাবুন তো, একটা গাছ নতুন মাটিতে বসানোর সাথে সাথেই যদি সার-পানি দেওয়া শুরু হয়, শিকড় বসার সুযোগ না দিয়ে — গাছটা বাড়ার বদলে নেতিয়ে পড়ে। ত্বকও অনেকটা এমন। আগে শান্ত হতে দিতে হয়, তারপর বাকি প্রোডাক্ট তাদের কাজ দেখাতে পারে।

তাই সুদিং অ্যাম্পুল দিয়ে ত্বকের সাথে আগে একটা মিল করিয়ে নিন। ইনশাআল্লাহ, রেজাল্ট আসবে।

শেষ কথা — আমরা ৩০ দিনে গ্যারান্টিড উজ্জ্বলতার প্রতিশ্রুতি দিচ্ছি না। কিন্তু এটুকু বলতে পারি, সঠিক গাইডলাইন মেনে চললে নিজে নিজে মার্কেটিং দেখে বা এলোমেলোভাবে প্রোডাক্ট ব্যবহার করার চেয়ে অনেক দ্রুত পরিবর্তন চোখে পড়বে।

আপনাদের মধ্যে কে কে ত্বক উজ্জ্বল করতে চান, কমেন্টে জানান।

<!-- ╔══════════════════════════════════════════════════════════════╗
     ║  ৬. ইঞ্জিন — এই অংশে হাত দেবেন না                              ║
     ╚══════════════════════════════════════════════════════════════╝ -->
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const CATS=CATEGORIES.concat([ALL_TILE]);const CMAP=Object.fromEntries(CATS.map(c=>[c[0],c]));
const href=c=>c==='All Samples'?'#/all':'#/cat/'+encodeURIComponent(c);
function md(t){if(!t||!t.trim())return '';return t.trim().split(/\n\s*\n/).map(b=>{b=b.trim();
if(b.startsWith('## '))return '<h4>'+inl(b.slice(3))+'</h4>';
if(b.startsWith('- '))return '<ul>'+b.split('\n').map(l=>'<li>'+inl(l.replace(/^- /,''))+'</li>').join('')+'</ul>';
if(b.startsWith('> '))return '<p class="pt">'+inl(b.slice(2))+'</p>';
return '<p>'+inl(b).replace(/\n/g,'<br>')+'</p>'}).join('')}
const PIECES=ARTICLES.map(a=>{const first=(a.bn||'').trim().split(/\n\s*\n/).find(x=>x.length>25&&!/^(## |> |- )/.test(x))||'';return{...a,cat:a.cats[0],ex:first.replace(/\*\*/g,'').slice(0,160)}});
const count=c=>c==='All Samples'?PIECES.length:PIECES.filter(p=>p.cats.includes(c)).length;
/* বাইন্ডিং: data-t="a.b" এলিমেন্টে SITE থেকে লেখা বসায় */
document.querySelectorAll('[data-t]').forEach(el=>{const v=el.dataset.t.split('.').reduce((o,k)=>o&&o[k],SITE);if(typeof v==='string')el.innerHTML=fmt(v)});
$('photo').src=PHOTO;$('logoImg').src=LOGO;$('footLogo').src=LOGO_FOOTER;
function card(p){const a=document.createElement('article');a.className='card';a.tabIndex=0;a.setAttribute('role','link');a.onclick=()=>nav('piece/'+p.id);a.onkeydown=e=>{if(e.key==='Enter')a.onclick()};
a.innerHTML=`<div class="tags">${p.cats.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div><h3>${esc(p.titleEn)}</h3><p class="bn" lang="bn">${esc(p.ex)}</p><span class="go">Read full piece · ${p.en&&p.en.trim()?'বাংলা + EN':'বাংলা'} →</span>`;return a}
let cur=null,lang='bn';
function view(v){['home','listView','detailView'].forEach(x=>$(x).classList.toggle('on',x===v))}
let stack=[];
function nav(h){h=String(h).replace(/^#\/?/,'');stack.push(h);try{history.replaceState(null,'','#/'+h)}catch(e){}route(h)}
function goBack(){stack.pop();const h=stack.length?stack[stack.length-1]:'';try{history.replaceState(null,'','#/'+h)}catch(e){}route(h)}
function route(h){window.scrollTo(0,0);
if(h.startsWith('piece/')){const p=PIECES.find(x=>x.id===h.slice(6));if(p)return openPiece(p)}
if(h==='all')return openList('All Samples');
if(h.startsWith('cat/')){const c=decodeURIComponent(h.slice(4));if(CMAP[c])return openList(c)}
view('home');document.title='Sher Solaiman | Skincare Content Writer'}
function openList(c){view('listView');$('listTitle').textContent=c==='All Samples'?'All writing samples':c;$('listKicker').textContent=c==='All Samples'?'Every format, every topic':'Category';const g=$('listGrid');g.innerHTML='';const items=PIECES.filter(p=>c==='All Samples'||p.cats.includes(c));
if(!items.length)g.innerHTML=`<div class="empty"><i class="fa-solid ${CMAP[c][1]}" style="font-size:30px;color:${CMAP[c][2]}"></i><p style="margin-top:10px"><b>${esc(c)}</b> samples aren’t on this page yet.</p><p style="margin-top:6px">Need this format for your brand? <a href="#/" data-go="contact" style="color:var(--brand);font-weight:700">Tell me about the project →</a></p></div>`;
items.forEach(p=>g.appendChild(card(p)));bindGo(g);document.title=c+' — Sher Solaiman'}
function openPiece(p){cur=p;view('detailView');$('dCats').innerHTML=p.cats.map(c=>`<span class="tag">${esc(c)}</span>`).join('');const hasEn=!!(p.en&&p.en.trim());$('langSw').hidden=!hasEn;lang=hasEn&&lang==='en'?'en':'bn';paint();document.title=p.titleEn+' — Sher Solaiman'}
function setLang(l){lang=l;paint()}
function paint(){const p=cur,en=lang==='en'&&p.en&&p.en.trim();$('dTitle').textContent=en?p.titleEn:p.titleBn;$('dTitle').classList.toggle('bn',!en);$('dTitle').lang=en?'en':'bn';const b=$('dBody');b.innerHTML=md(en?p.en:p.bn);b.lang=en?'en':'bn';b.classList.toggle('bn',!en);document.querySelectorAll('#langSw button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.l===lang));$('dTags').innerHTML=(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
async function shareCur(){try{if(navigator.share)await navigator.share({title:cur.titleEn,url:location.href});else{await navigator.clipboard.writeText(location.href);$('shareLbl').textContent='Link copied!';setTimeout(()=>$('shareLbl').textContent='Share this piece',2000)}}catch(e){}}
function go(id){const e=$(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
function bindGo(root){root.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();$('mnav').classList.remove('open');const t=a.dataset.go;if($('home').classList.contains('on'))go(t);else{nav('');setTimeout(()=>go(t),200)}}))}
let AC=null,seqT=[];
/* হালকা পপ সাউন্ড (কোনো অডিও ফাইল লাগে না) */
function unlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tick(i){if(!SITE.sound||!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=[523.25,587.33,659.25,783.99,880,987.77,1046.5,1174.66][i%8];
o.type='sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.05,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.19)}catch(e){}}
/* Read my work: নিচের ক্যাটাগরি সেকশনে নিয়ে যায়, তারপর টাইলগুলো ধারাবাহিকভাবে পপ-আপ হয় */
$('readBtn').onclick=()=>{seqT.forEach(clearTimeout);seqT=[];unlock();const tiles=[...$('catGrid').children];tiles.forEach(x=>x.classList.remove('pulse'));go('categories');
if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
tiles.forEach((x,i)=>{seqT.push(setTimeout(()=>{x.classList.remove('pulse');void x.offsetWidth;x.classList.add('pulse');tick(i)},450+i*125));seqT.push(setTimeout(()=>x.classList.remove('pulse'),450+i*125+520))})};
$('burger').onclick=()=>{const o=$('mnav').classList.toggle('open');$('burger').setAttribute('aria-expanded',o)};
function showThanks(){const t=$('thanks');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1000)}
$('briefForm').addEventListener('submit',async e=>{e.preventDefault();const v=id=>$(id).value.trim();let ok=true;
const chk=(id,er,bad,m)=>{$(er).textContent=bad?m:'';$(id).setAttribute('aria-invalid',bad);if(bad)ok=false};
chk('fName','eName',v('fName').length<2,'Please enter your name.');
chk('fEmail','eEmail',!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v('fEmail')),'Please enter a valid email.');
chk('fService','eSvc',!v('fService'),'Please choose a service.');
chk('fSum','eSum',v('fSum').length<15,'Please add at least 15 characters.');
const s=$('fStatus');if(!ok){s.className='fs bad';s.textContent='Please fix the highlighted fields.';return}
const btn=$('sendBtn');btn.disabled=true;s.className='fs';s.textContent='Sending…';
try{if(!BRIEF_ENDPOINT)throw new Error('no endpoint');
const r=await fetch(BRIEF_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v('fName'),email:v('fEmail'),brand:v('fBrand'),budget:v('fBudget'),service:v('fService'),summary:v('fSum'),hp:v('fHp')})});
if(!r.ok)throw new Error('failed');
$('briefForm').reset();s.textContent='';showThanks()}
catch(err){const m=SITE.contact.email;s.className='fs bad';s.innerHTML='Couldn’t send automatically. Please email me directly at <a style="text-decoration:underline" href="mailto:'+esc(m)+'?subject='+encodeURIComponent('Skincare brief from '+v('fName'))+'&body='+encodeURIComponent(v('fSum'))+'">'+esc(m)+'</a>.'}
btn.disabled=false});
/* রেন্ডার */
const tile=c=>`<a class="cat" href="${href(c[0])}"><i class="fa-solid ${c[1]}" style="color:${c[2]}" aria-hidden="true"></i><b>${esc(c[0])}</b></a>`;
$('catGrid').innerHTML=CATS.map(tile).join('');
PIECES.filter(p=>p.featured).slice(0,SITE.featuredCount).forEach(p=>$('featGrid').appendChild(card(p)));$('nAll').textContent=PIECES.length;
$('aboutBody').innerHTML=SITE.about.body.map(p=>`<p>${esc(p)}</p>`).join('');
$('statement').innerHTML=SITE.hero.statement.map(s=>`<span>${fmt(s).replace(/\n/g,'<br>')}</span>`).join('');
$('svcGrid').innerHTML=SITE.services.items.map((s,i)=>`<a class="svc" href="${href(s[2])}"><span class="n">0${i+1}</span><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p><span class="go">See samples →</span></a>`).join('');
$('steps').innerHTML=SITE.approach.steps.map((s,i)=>`<div class="st"><span class="n">0${i+1}</span><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join('');
$('proofGrid').innerHTML=SITE.proof.items.map(s=>`<div class="pf"><i class="fa-solid fa-check"></i><div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div></div>`).join('');
$('fService').innerHTML='<option value="">Choose a service</option>'+SITE.contact.services.map(s=>`<option>${esc(s)}</option>`).join('');
if(CLIENTS.length){
/* লোগো ক্যারাসোল: একসাথে ৮টি (৪টি করে ২ সারি), ধাপে ধাপে পরের ৮টিতে যায় */
const per=8,n=CLIENTS.length,pages=Math.ceil(n/per),tr=$('carTrack'),dots=$('carDots');let cur=0,timer=null,vis=false;
const mk=c=>{const el=document.createElement(c.link?'a':'div');el.className='lg';if(c.link){el.href=c.link;el.target='_blank';el.rel='noopener noreferrer'}el.setAttribute('aria-label',c.name||'Client logo');el.innerHTML=`<img src="${esc(c.logo)}" alt="${esc(c.name||'Client logo')}" loading="lazy">`;return el};
const show=p=>{cur=(p+pages)%pages;tr.style.transform=`translateX(-${cur*100}%)`;[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur))};
const stop=()=>{clearInterval(timer);timer=null};
const play=()=>{stop();if(pages>1&&vis&&!matchMedia('(prefers-reduced-motion:reduce)').matches)timer=setInterval(()=>show(cur+1),(SITE.proof.carouselSeconds||2.5)*1000)};
for(let p=0;p<pages;p++){const pg=document.createElement('div');pg.className='car-page';pg.setAttribute('role','group');pg.setAttribute('aria-label','Logos '+(p+1)+' of '+pages);for(let k=0;k<per;k++)pg.appendChild(mk(CLIENTS[(p*per+k)%n]));tr.appendChild(pg);const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','Show logos page '+(p+1));d.onclick=()=>{show(p);play()};dots.appendChild(d)}
$('carPrev').onclick=()=>{show(cur-1);play()};$('carNext').onclick=()=>{show(cur+1);play()};
if(pages<2)document.querySelector('.car-ctl').hidden=true;
const car=$('car');car.addEventListener('mouseenter',stop);car.addEventListener('mouseleave',play);
let sx=null;car.addEventListener('pointerdown',e=>{sx=e.clientX;stop()});car.addEventListener('pointerup',e=>{if(sx!==null&&Math.abs(e.clientX-sx)>40)show(cur+(e.clientX<sx?1:-1));sx=null;play()});car.addEventListener('pointercancel',()=>{sx=null;play()});
new IntersectionObserver(es=>{vis=es[0].isIntersecting;vis?play():stop()},{threshold:.25}).observe(car);show(0)}else $('clientsWrap').hidden=true;
if(CLIENTS.length||TESTIMONIALS.length)$('slots').hidden=true;
if(TESTIMONIALS.length){$('reviews').innerHTML=TESTIMONIALS.map(t=>`<figure class="quote"><div class="stars" role="img" aria-label="${t.rating} out of 5">${'★'.repeat(t.rating)}${'☆'.repeat(5-t.rating)}</div><blockquote style="margin-top:8px;font-size:14px">${esc(t.text)}</blockquote><figcaption style="font-size:12px;font-weight:700;margin-top:10px">${esc(t.name)}, ${esc(t.role)} · ${esc(t.brand)}</figcaption></figure>`).join('')}
const C=SITE.contact,LK=[['fa-solid fa-envelope','mailto:'+C.email,C.email,'Email Sher'],['fa-brands fa-whatsapp','https://wa.me/'+C.whatsapp,'WhatsApp','WhatsApp'],['fa-brands fa-telegram',C.telegram,'Telegram','Telegram']];
if(C.linkedin)LK.push(['fa-brands fa-linkedin',C.linkedin,'LinkedIn','LinkedIn']);
const ext=u=>u.startsWith('http')?' target="_blank" rel="noopener noreferrer"':'';
$('directLinks').innerHTML=LK.map(l=>`<a href="${esc(l[1])}"${ext(l[1])}><i class="${l[0]}"></i>${esc(l[2])}</a>`).join('');
$('footLinks').innerHTML=LK.map(l=>`<li><a href="${esc(l[1])}"${ext(l[1])}>${esc(l[3])}</a></li>`).join('')+'<li><a href="#terms" onclick="document.getElementById(\'terms\').showModal();return false">Terms &amp; disclaimer</a></li>';
/* Let's talk: যোগাযোগ প্যানেল */
$('talkPanel').innerHTML=LK.map((l,i)=>`<a role="menuitem" style="--i:${i}" href="${esc(l[1])}"${ext(l[1])}><i class="${l[0]}"></i>${esc(l[2]==='Telegram'||l[2]==='WhatsApp'||l[2]==='LinkedIn'?l[2]:'Email')}</a>`).join('');
function talk(o){$('talkPanel').classList.toggle('on',o);$('talkBtn').setAttribute('aria-expanded',o)}
$('talkBtn').onclick=e=>{e.stopPropagation();talk(!$('talkPanel').classList.contains('on'))};
document.addEventListener('click',e=>{if(!e.target.closest('#talkPanel'))talk(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')talk(false)});
/* ছবির ওপরের লেখা: অক্ষর একটা একটা করে ওঠে → ৩ সেকেন্ড থাকে → মুছে যায় → ০.৫ সেকেন্ড পর আবার ওঠে */
(function(){const el=$('kickTxt'),txt=SITE.hero.kicker;el.setAttribute('aria-label',txt);el.innerHTML=[...txt].map(c=>`<span class="ch" aria-hidden="true">${esc(c)}</span>`).join('');const ch=[...el.children];
if(matchMedia('(prefers-reduced-motion:reduce)').matches){ch.forEach(c=>c.classList.add('on'));return}
function run(){ch.forEach(c=>c.classList.remove('on'));let i=0;(function nx(){if(i<ch.length){ch[i++].classList.add('on');setTimeout(nx,70)}else setTimeout(()=>{ch.forEach(c=>c.classList.remove('on'));setTimeout(run,500)},3000)})()}
run()})();
bindGo(document);
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.08});document.querySelectorAll('.rev').forEach(x=>io.observe(x));
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(!a||a.hasAttribute('data-go'))return;e.preventDefault();$('mnav').classList.remove('open');nav(a.getAttribute('href'))});
window.addEventListener('hashchange',()=>route(location.hash.replace(/^#\/?/,'')));
route(location.hash.replace(/^#\/?/,''));stack=[location.hash.replace(/^#\/?/,'')];
</script>
</body>
</html>
